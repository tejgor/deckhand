"textEditor/editText" = { "args.0.cursor" = "args.0.text", "ret.cursor" = "ret.text" }
"textEditor/editorLines" = { "args.0.cursor" = "args.0.text" }
"textEditor/lineEnd" = { "args.1" = "args.0", "ret" = "args.0" }
"textEditor/lineStart" = { "args.1" = "args.0", "ret" = "args.0" }
"textEditor/moveVisual" = { "args.1" = "args.0", "ret" = "args.0" }
"textEditor/replaceRange" = { "args.0.cursor" = "args.0.text", "args.1" = "args.0.text", "args.2" = "args.0.text", "ret.cursor" = "ret.text" }
"textEditor/wordLeft" = { "args.1" = "args.0", "ret" = "args.0" }
"textEditor/wordRight" = { "args.1" = "args.0", "ret" = "args.0" }
"textEditor/wrapRows" = { "ret.*.start" = "args.0", "ret.*.end" = "args.0" }
"textEditor/wrappedEditorLines" = { "args.0.cursor" = "args.0.text" }

