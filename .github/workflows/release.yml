name: release
# Tag `vX.Y.Z` (matching the workspace version in Cargo.toml) to build the native binaries and publish a GitHub
# release. Nothing is published to npm or crates.io.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Check the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="deckhand"))')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo version v$version" >&2
            exit 1
          fi
      - run: cargo build --release --locked -p deckhand --target ${{ matrix.target }}
      - name: Smoke test
        run: target/${{ matrix.target }}/release/deckhand --version
      - name: Package
        run: |
          name="deckhand-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/deckhand" README.md LICENSE "dist/$name/"
          strip "dist/$name/deckhand" || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: deckhand-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: |
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm ./*.sha256
          sha256sum --check SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Deckhand ${GITHUB_REF_NAME}" \
            --generate-notes
