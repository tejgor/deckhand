# Appends the "Daemon restart" line to a release's notes once dist has published it.
#
# Called by release.yml (generated by dist) as a post-announce job: dist-workspace.toml lists it in
# `post-announce-jobs`, and dist passes its plan (JSON) as the `plan` input. The decision lives in
# scripts/release-restart-note.sh so it can be run locally.
name: Release notes

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write

jobs:
  restart-note:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Every tag and its history: the note compares this release with the previous one.
          fetch-depth: 0
          persist-credentials: false
      - name: Append the daemon restart note
        shell: bash
        run: |
          set -euo pipefail
          line=$(scripts/release-restart-note.sh "$TAG")
          echo "$line"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if grep -qF '**Daemon restart:**' "$RUNNER_TEMP/notes.md"; then
            echo "The notes already have a daemon restart line."
            exit 0
          fi
          printf '\n%s\n' "$line" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
      # CHANGELOG.md links into the repository (docs/features.md#…); on a release page those resolve under
      # /releases/tag/ and break, so point them at the release's own files.
      - name: Make links to the repository's files absolute
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/links.md"
          sed -E "s#\]\((docs/|CHANGELOG\.md|README\.md|HANDOFF\.md)#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/\1#g" \
            "$RUNNER_TEMP/links.md" > "$RUNNER_TEMP/links-absolute.md"
          if cmp -s "$RUNNER_TEMP/links.md" "$RUNNER_TEMP/links-absolute.md"; then
            echo "No relative links to fix."
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/links-absolute.md"
