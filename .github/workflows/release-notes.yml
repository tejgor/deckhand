# Appends the "Daemon restart" line to a release's notes once dist has published it.
#
# Called by release.yml (generated by dist) as a post-announce job: dist-workspace.toml lists it in
# `post-announce-jobs`, and dist passes its plan (JSON) as the `plan` input. The decision lives in
# scripts/release-restart-note.sh so it can be run locally.
name: Release notes

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write

jobs:
  restart-note:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Every tag and its history: the note compares this release with the previous one.
          fetch-depth: 0
          persist-credentials: false
      - name: Append the daemon restart note
        shell: bash
        run: |
          set -euo pipefail
          line=$(scripts/release-restart-note.sh "$TAG")
          echo "$line"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if grep -qF '**Daemon restart:**' "$RUNNER_TEMP/notes.md"; then
            echo "The notes already have a daemon restart line."
            exit 0
          fi
          printf '\n%s\n' "$line" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
