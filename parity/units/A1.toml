id = "A1"
wave = 3
title = "app: effects, subscriptions, layout, ui_loop hand-off"
crate = "ui"
ts_sources = ["src/app.tsx", "src/cli.ts"]
rust_paths = ["crates/ui/src/app/mod.rs", "crates/ui/src/app/effects.rs", "crates/ui/src/app/layout.rs", "crates/deckhand/src/ui_loop.rs"]
deps = []
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/nodeEnvUi.test.ts", "tests/daemonFeatures.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []
# Wave 0 hand-off notes for this unit.
notes = [
  "Implement crates/deckhand/src/ui_loop.rs run_ui calling deckhand_ui::app::run(AppProps) with StdinReader/RawMode/spawn_resize_watcher from event_loop.rs; drop the duplicate TerminalView type in ui_loop if ui defines one.",
  "Screen goldens from the TS UI: fixtures/ui/*.txt|json (README lists key scripts and normalisations) — compare your screens where applicable.",
]

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
app.App = "crates/ui/src/app/state.rs::App"
# cli.ts exports nothing; its UI hand-off (runUi: render App, wait for its exit, then attach / $EDITOR) is
# ported by crates/deckhand/src/ui_loop.rs around deckhand_ui::app::run. Mapped here for the record.

# Non-exported TS internals mapped for traceability (not checked by verify-unit).
[internals]
"cli.runUi" = "crates/deckhand/src/ui_loop.rs::run_ui"
