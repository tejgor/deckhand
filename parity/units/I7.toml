fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []
# Wave 0 hand-off notes for this unit.
notes = [
  "agent_path::hook_command must resolve the executable like deckhand::hooks: the `deckhand` on $PATH when it is the same inode as current_exe, else current_exe — Settings' expected Codex hook command, Claude --settings, and `deckhand hooks` must agree.",
  "Settings must detect stale Codex hook entries (`node ... cli.js hook`) and warn; never write ~/.codex.",
]

