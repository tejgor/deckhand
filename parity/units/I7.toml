id = "I7"
wave = 1
title = "settings info, session features I/O, agent PATH resolution"
crate = "sys"
ts_sources = ["src/settingsInfo.ts", "src/sessionFeatures.ts", "src/agentSignals.ts"]
rust_paths = ["crates/sys/src/settings_info.rs", "crates/sys/src/session_features.rs", "crates/sys/src/agent_path.rs"]
deps = ["I3", "I4", "I6", "P1", "P8"]
ts_tests = ["tests/agentPath.test.ts"]
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = []

