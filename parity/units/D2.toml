id = "D2"
wave = 2
title = "daemon lifecycle: startup, recovery, migrations, persist, shutdown"
crate = "daemon"
ts_sources = ["src/daemon.ts"]
rust_paths = ["crates/daemon/src/lifecycle.rs"]
deps = ["D1"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/daemonFeatures.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []
# Wave 0 hand-off notes for this unit.
notes = [
  "Startup must reproduce fixtures/state/home-v45 -> home-v45.after-idle exactly (see fixtures/state/README.md for the replay procedure and normalisation); running sessions become interrupted.",
]

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]

# Non-exported TS internals mapped for traceability (not checked by verify-unit).
[internals]
"daemon.persistedSession" = "crates/daemon/src/lifecycle.rs::persisted_session"
"daemon.isProcessAlive" = "crates/daemon/src/lifecycle.rs::is_process_alive"
"daemon.start" = "crates/daemon/src/daemon.rs::Daemon::start"
"daemon.log" = "crates/daemon/src/daemon.rs::Daemon::log"
"daemon.assertNoLiveDaemonFromPidFile" = "crates/daemon/src/daemon.rs::Daemon::assert_no_live_daemon_from_pid_file"
"daemon.writePidFile" = "crates/daemon/src/daemon.rs::Daemon::write_pid_file"
"daemon.removePidFile" = "crates/daemon/src/daemon.rs::Daemon::remove_pid_file"
"daemon.setupProcessHandlers" = "crates/daemon/src/daemon.rs::Daemon::setup_process_handlers"
"daemon.cleanup" = "crates/daemon/src/daemon.rs::Daemon::cleanup"
"daemon.persist" = "crates/daemon/src/daemon.rs::Daemon::persist"
"daemon.handleRequest.shutdown" = "crates/daemon/src/daemon.rs::Daemon::handle_shutdown"
