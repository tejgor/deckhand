id = "D2"
wave = 2
title = "daemon lifecycle: startup, recovery, migrations, persist, shutdown"
crate = "daemon"
ts_sources = ["src/daemon.ts"]
rust_paths = ["crates/daemon/src/lifecycle.rs"]
deps = ["D1"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/daemonFeatures.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"daemon.ts:persistedSession" = "deckhand_daemon::lifecycle::persisted_session"
"daemon.ts:isProcessAlive" = "deckhand_daemon::lifecycle::is_process_alive"
"daemon.ts:start" = "deckhand_daemon::daemon::Daemon::start"
"daemon.ts:log" = "deckhand_daemon::daemon::Daemon::log"
"daemon.ts:assertNoLiveDaemonFromPidFile" = "deckhand_daemon::daemon::Daemon::assert_no_live_daemon_from_pid_file"
"daemon.ts:writePidFile" = "deckhand_daemon::daemon::Daemon::write_pid_file"
"daemon.ts:removePidFile" = "deckhand_daemon::daemon::Daemon::remove_pid_file"
"daemon.ts:setupProcessHandlers" = "deckhand_daemon::daemon::Daemon::setup_process_handlers"
"daemon.ts:cleanup" = "deckhand_daemon::daemon::Daemon::cleanup"
"daemon.ts:persist" = "deckhand_daemon::daemon::Daemon::persist"
"daemon.ts:handleRequest.shutdown" = "deckhand_daemon::daemon::Daemon::handle_shutdown"
