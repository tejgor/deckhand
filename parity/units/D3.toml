id = "D3"
wave = 2
title = "daemon sessions"
crate = "daemon"
ts_sources = ["src/daemon.ts"]
rust_paths = ["crates/daemon/src/sessions.rs"]
deps = ["D1"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/daemonFeatures.test.ts", "tests/forks.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"daemon.ts:SessionMap" = "deckhand_daemon::daemon::Daemon::set_session"
"daemon.ts:silentExitNote" = "deckhand_daemon::sessions::silent_exit_note"
"daemon.ts:truncateSessionTitle" = "deckhand_daemon::sessions::truncate_session_title"
"daemon.ts:inheritedChildTitle" = "deckhand_daemon::sessions::inherited_child_title"
"daemon.ts:readAgentExit" = "deckhand_daemon::sessions::read_agent_exit"
"daemon.ts:requireSession" = "deckhand_daemon::daemon::Daemon::require_session"
"daemon.ts:saveSession" = "deckhand_daemon::daemon::Daemon::save_session"
"daemon.ts:setSessionInWorkspace" = "deckhand_daemon::daemon::Daemon::set_session_in_workspace"
"daemon.ts:patchSession" = "deckhand_daemon::daemon::Daemon::patch_session"
"daemon.ts:sessionsForRepo" = "deckhand_daemon::daemon::Daemon::sessions_for_repo"
"daemon.ts:handleWorkerSessionExit" = "deckhand_daemon::daemon::Daemon::handle_worker_session_exit"
"daemon.ts:reorderSession" = "deckhand_daemon::daemon::Daemon::reorder_session"
"daemon.ts:sameRepository" = "deckhand_daemon::daemon::Daemon::same_repository"
"daemon.ts:createSession" = "deckhand_daemon::daemon::Daemon::create_session"
"daemon.ts:finishCreateSession" = "deckhand_daemon::daemon::Daemon::finish_create_session"
"daemon.ts:failStartingSession" = "deckhand_daemon::daemon::Daemon::fail_starting_session"
"daemon.ts:restartSession" = "deckhand_daemon::daemon::Daemon::restart_session"
"daemon.ts:killSession" = "deckhand_daemon::daemon::Daemon::kill_session"
"daemon.ts:removeSession" = "deckhand_daemon::daemon::Daemon::remove_session"
"daemon.ts:exportSessionHandoff" = "deckhand_daemon::daemon::Daemon::export_session_handoff"
"daemon.ts:handleRequest.list" = "deckhand_daemon::daemon::Daemon::handle_list"
"daemon.ts:handleRequest.set-session-done" = "deckhand_daemon::daemon::Daemon::handle_set_session_done"
"daemon.ts:handleRequest.archive-session" = "deckhand_daemon::daemon::Daemon::handle_archive_session"
"daemon.ts:handleRequest.export-handoff" = "deckhand_daemon::daemon::Daemon::handle_export_handoff"
"daemon.ts:handleRequest.cancel-start" = "deckhand_daemon::daemon::Daemon::handle_cancel_start"
"daemon.ts:handleRequest.remove" = "deckhand_daemon::daemon::Daemon::handle_remove"
