id = "I1"
wave = 1
title = "storage, ui state"
crate = "sys"
ts_sources = ["src/storage.ts", "src/uiState.ts"]
rust_paths = ["crates/sys/src/storage.rs", "crates/sys/src/ui_state.rs"]
deps = ["P2", "P8"]
ts_tests = ["tests/storage.test.ts"]
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = []

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"storage.ts:InkState" = "deckhand_protocol::records::StateFile"
"storage.ts:AppConfig" = "deckhand_protocol::records::AppConfig"
"storage.ts:ensureConfigDir" = "deckhand_sys::storage::ensure_config_dir"
"storage.ts:loadState" = "deckhand_sys::storage::load_state"
"storage.ts:saveState" = "deckhand_sys::storage::save_state"
"storage.ts:markAllNonExitedSessionsExited" = "deckhand_sys::storage::mark_all_non_exited_sessions_exited"
"storage.ts:sortSessionsNewestFirst" = "deckhand_sys::storage::sort_sessions_newest_first"
"storage.ts:loadAppConfig" = "deckhand_sys::storage::load_app_config"
"storage.ts:updateAppConfig" = "deckhand_sys::storage::update_app_config"
"storage.ts:stateFileDisplayPath" = "deckhand_sys::storage::state_file_display_path"
"uiState.ts:UiState" = "deckhand_protocol::records::UiState"
"uiState.ts:normalizeUiState" = "deckhand_protocol::records::UiState::normalize"
"uiState.ts:loadUiState" = "deckhand_sys::ui_state::load_ui_state"
"uiState.ts:saveUiState" = "deckhand_sys::ui_state::save_ui_state"
