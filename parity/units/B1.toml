id = "B1"
wave = 1
title = "binary: argv dispatch, hook, hooks, debug prod-home guard"
crate = "deckhand"
ts_sources = ["src/cli.ts"]
rust_paths = ["crates/deckhand/src/main.rs", "crates/deckhand/src/cli.rs", "crates/deckhand/src/hook.rs", "crates/deckhand/src/hooks.rs", "crates/deckhand/src/guard.rs"]
deps = ["K1"]
ts_tests = ["tests/hookBridge.test.ts"]
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = []

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []
# Wave 0 hand-off notes for this unit.
notes = [
  "cli.rs run_session_worker/run_workspace_worker/run_daemon must call deckhand_worker::session::run_session_worker, deckhand_worker::workspace::run_workspace_worker, deckhand_daemon::run_daemon inside the current_thread runtime + LocalSet; exit codes as TS.",
  "UI entry: call deckhand::ui_loop::run_ui (A1 implements it in Wave 3); keep it a stub call here.",
]

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]

# cli.ts has no exports (it is the entry script). Its main dispatch maps to deckhand::cli::{parse_args, run}, the hook
# branch to deckhand::hook::run_hook, the hooks branch to deckhand::hooks::run_hooks; runUi and the attach/editor loop
# are unit A1 (deckhand::ui_loop).
