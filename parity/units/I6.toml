id = "I6"
wave = 1
title = "project config load/documents, worktree links I/O"
crate = "sys"
ts_sources = ["src/projectConfig.ts", "src/projectConfigDocument.ts", "src/worktreeLinks.ts"]
rust_paths = ["crates/sys/src/config.rs", "crates/sys/src/config_document.rs", "crates/sys/src/worktree_links.rs"]
deps = ["I1", "I3", "P2", "P10"]
ts_tests = ["tests/creationTrust.test.ts", "tests/worktreeSettings.test.ts"]
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = []

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"projectConfig.ts:readBoundedUtf8" = "deckhand_sys::config::read_bounded_utf8"
"projectConfig.ts:loadProjectConfig" = "deckhand_sys::config::load_project_config"
"projectConfig.ts:savedProjectTrust" = "deckhand_sys::config::saved_project_trust"
"projectConfigDocument.ts:readConfigTargets" = "deckhand_sys::config_document::read_config_targets"
"projectConfigDocument.ts:readProjectConfigDocument" = "deckhand_sys::config_document::read_project_config_document"
"projectConfigDocument.ts:saveProjectConfigDocument" = "deckhand_sys::config_document::save_project_config_document"
"projectConfigDocument.ts:readGlobalDefaultsDocument" = "deckhand_sys::config_document::read_global_defaults_document"
"projectConfigDocument.ts:saveGlobalDefaultsDocument" = "deckhand_sys::config_document::save_global_defaults_document"
"worktreeLinks.ts:userSlug" = "deckhand_sys::worktree_links::user_slug"
"worktreeLinks.ts:applyWorktreeLinks" = "deckhand_sys::worktree_links::apply_worktree_links"
