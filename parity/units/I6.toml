id = "I6"
wave = 1
title = "project config load/documents, worktree links I/O"
crate = "sys"
ts_sources = ["src/projectConfig.ts", "src/projectConfigDocument.ts", "src/worktreeLinks.ts"]
rust_paths = ["crates/sys/src/config.rs", "crates/sys/src/config_document.rs", "crates/sys/src/worktree_links.rs"]
deps = ["I1", "I3", "P2", "P10"]
ts_tests = ["tests/creationTrust.test.ts", "tests/worktreeSettings.test.ts"]
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = []

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
projectConfig.readBoundedUtf8 = "crates/sys/src/config.rs::read_bounded_utf8"
projectConfig.loadProjectConfig = "crates/sys/src/config.rs::load_project_config"
projectConfig.savedProjectTrust = "crates/sys/src/config.rs::saved_project_trust"
projectConfigDocument.readConfigTargets = "crates/sys/src/config_document.rs::read_config_targets"
projectConfigDocument.readProjectConfigDocument = "crates/sys/src/config_document.rs::read_project_config_document"
projectConfigDocument.saveProjectConfigDocument = "crates/sys/src/config_document.rs::save_project_config_document"
projectConfigDocument.readGlobalDefaultsDocument = "crates/sys/src/config_document.rs::read_global_defaults_document"
projectConfigDocument.saveGlobalDefaultsDocument = "crates/sys/src/config_document.rs::save_global_defaults_document"
worktreeLinks.userSlug = "crates/sys/src/worktree_links.rs::user_slug"
worktreeLinks.applyWorktreeLinks = "crates/sys/src/worktree_links.rs::apply_worktree_links"
