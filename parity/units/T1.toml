id = "T1"
wave = 1
title = "terminal preview on alacritty_terminal (gated on xterm goldens)"
crate = "term"
ts_sources = ["src/terminalPreview.ts", "src/nodePty.ts"]
rust_paths = ["crates/term/src/alacritty.rs", "crates/term/src/preview.rs"]
deps = []
ts_tests = ["tests/nodePty.test.ts"]
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = []

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = [
  { title = "concurrent starts sign node-pty's spawn-helper once, atomically, and leave a valid one alone", to = "drop", reason = "tests nodePty.signIfNeeded, which signs node-pty's prebuilt spawn-helper; the port spawns PTYs natively (deckhand_term::pty) and ships no helper to sign" },
]
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []
# Wave 0 hand-off notes for this unit.
notes = [
  "Gate: fixtures/term/*.golden.json (15 streams in fixtures/term/streams/, regenerate with node --import tsx parity/gen/term.gen.ts). Write a Rust test that replays every stream through deckhand_term::alacritty + preview and compares to the goldens (xterm screen snapshot AND TerminalPreview output, incl. checkpoints/resizes). Adapt headless::ScreenSnapshot to the golden shape. synthetic-c1-controls is an allowlist candidate (alacritty C1 handling); OSC 8 / underline style are not in the goldens.",
  "tests/nodePty.test.ts tests node-pty's signIfNeeded, which the port drops: add it to deferred_tests with to = \"drop\".",
]

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
terminalPreview.TerminalPreview = "crates/term/src/preview.rs::TerminalPreview"
nodePty.signIfNeeded = "drop: signs node-pty's prebuilt spawn-helper/pty.node; deckhand_term::pty spawns natively, nothing to sign"
nodePty.ensureNodePtyReady = "drop: readies node-pty's macOS prebuilds (chmod, quarantine, codesign); replaced by deckhand_term::pty::Pty::spawn, which needs no setup"
