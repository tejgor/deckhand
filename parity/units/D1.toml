# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []
# Wave 0 hand-off notes for this unit.
notes = [
  "You also own crates/daemon/src/dispatch.rs (completed in Wave 0; adjust only if needed). Decide ParsedRequest::Invalid handling to match TS (TS does not validate fields of a known type; prefer lenient decoding so a TS client's messages are never rejected where TS accepts them).",
