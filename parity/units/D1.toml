id = "D1"
wave = 2
title = "daemon core state, server, worker channel"
crate = "daemon"
ts_sources = ["src/daemon.ts"]
rust_paths = ["crates/daemon/src/daemon.rs", "crates/daemon/src/server.rs", "crates/daemon/src/worker_channel.rs"]
deps = ["W1"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/daemonFeatures.test.ts", "tests/forks.test.ts", "tests/agentUpdates.test.ts", "tests/mergeDaemon.test.ts", "tests/noteItemsDaemon.test.ts", "tests/notesDaemon.test.ts", "tests/tasksDaemon.test.ts", "tests/worktreesDaemon.test.ts", "tests/hookBridge.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"daemon.ts:InkDaemon" = "deckhand_daemon::daemon::Daemon"
"daemon.ts:DEFAULT_PREVIEW_COLS" = "deckhand_daemon::server::DEFAULT_PREVIEW_COLS"
"daemon.ts:DEFAULT_PREVIEW_ROWS" = "deckhand_daemon::server::DEFAULT_PREVIEW_ROWS"
