id = "D11"
wave = 2
title = "daemon config, settings, trust"
crate = "daemon"
ts_sources = ["src/daemon.ts"]
rust_paths = ["crates/daemon/src/config.rs"]
deps = ["D1"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/daemonFeatures.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"daemon.ts:projectInfo" = "deckhand_daemon::config::project_info"
"daemon.ts:listBranches" = "deckhand_daemon::daemon::Daemon::list_branches"
"daemon.ts:handleRequest.save-config" = "deckhand_daemon::daemon::Daemon::handle_save_config"
"daemon.ts:handleRequest.settings-info" = "deckhand_daemon::daemon::Daemon::handle_settings_info"
"daemon.ts:handleRequest.worktree-candidates" = "deckhand_daemon::daemon::Daemon::handle_worktree_candidates"
"daemon.ts:handleRequest.global-link-candidates" = "deckhand_daemon::daemon::Daemon::handle_global_link_candidates"
"daemon.ts:handleRequest.worktree-candidate-sizes" = "deckhand_daemon::daemon::Daemon::handle_worktree_candidate_sizes"
"daemon.ts:handleRequest.project-info" = "deckhand_daemon::daemon::Daemon::handle_project_info"
"daemon.ts:handleRequest.trust-project" = "deckhand_daemon::daemon::Daemon::handle_trust_project"
