id = "P1"
wave = 1
title = "agents, agent versions, agent signals (pure)"
crate = "core"
ts_sources = ["src/agents.ts", "src/agentVersions.ts", "src/agentSignals.ts"]
rust_paths = ["crates/core/src/agents.rs", "crates/core/src/agent_versions.rs", "crates/core/src/agent_signals.rs"]
deps = []
ts_tests = ["tests/agents.test.ts", "tests/agentVersions.test.ts"]
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = []

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = [
  "agents/agentSpec", "agents/newAgentRef", "agents/launchArgs", "agents/sameAgentSessionRef", "agents/forksParentAgain", "agents/relaunchPlan", "agents/exitRef", "agents/missingConversation", "agents/forkFailed",
  "agentVersions/parseVersion", "agentVersions/compareVersions", "agentVersions/agentUpdateStatus", "agentVersions/sessionOutdated", "agentVersions/installedVersions", "agentVersions/updateHint",
  "agentSignals-P1/normalizeHook", "agentSignals-P1/answersPrompt", "agentSignals-P1/hookPayloadFields", "agentSignals-P1/hooksEnabled", "agentSignals-P1/attentionMessage", "agentSignals-P1/shellQuote", "agentSignals-P1/codexResumeFromOutput", "agentSignals-P1/needsAttention",
]
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = [
  { title = "sidebar: ↑ before the agent glyph on outdated running sessions, dropped first; the details name both versions", to = "U2", reason = "asserts sidebarRows/sessionDetails (P8) and the rendered Sidebar pane (U2)" },
  { title = "Agents screen: one row per agent with versions and status, details of the selected one, confirmation, results", to = "F1", reason = "renders the AgentsPane (agentsFlow)" },
]
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = [
  { fixture = "agents/exitRef", case = 27, reason = "security fix (argv injection): a Claude resume hint whose value starts with '-' is skipped (TS returned it as a Name ref that launch_args turned into a --resume flag)" },
]

