id = "D5"
wave = 2
title = "daemon agents + hooks"
crate = "daemon"
ts_sources = ["src/daemon.ts"]
rust_paths = ["crates/daemon/src/agents.rs", "crates/daemon/src/hooks.rs"]
# D3 (merged for its sessions code, with its own deps D2/D4) is in-wave; listed so its files are out of scope.
deps = ["D1", "D2", "D3", "D4"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/agentUpdates.test.ts", "tests/hookBridge.test.ts", "tests/forks.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]

# Non-exported TS internals mapped for traceability (not checked by verify-unit).
[internals]
"daemon.AGENT_VERSIONS_TICK_MS" = "crates/daemon/src/agents.rs::AGENT_VERSIONS_TICK"
"daemon.publishAgentVersions" = "crates/daemon/src/daemon.rs::Daemon::publish_agent_versions"
"daemon.refreshAgentVersions" = "crates/daemon/src/daemon.rs::Daemon::refresh_agent_versions"
"daemon.updateAgent" = "crates/daemon/src/daemon.rs::Daemon::update_agent"
"daemon.handleRequest.agent-versions" = "crates/daemon/src/daemon.rs::Daemon::handle_agent_versions"
"daemon.DRAFT_WAIT_MS" = "crates/daemon/src/hooks.rs::DRAFT_WAIT"
"daemon.DRAFT_SETTLE_MS" = "crates/daemon/src/hooks.rs::DRAFT_SETTLE"
"daemon.AGENT_PROMPT_PATTERN" = "crates/daemon/src/hooks.rs::AGENT_PROMPT_PATTERN"
"daemon.execFileAsync" = "drop: promisify(execFile) for notify; deckhand_sys::proc::exec does that"
"daemon.handleAgentHook" = "crates/daemon/src/daemon.rs::Daemon::handle_agent_hook"
"daemon.markAnswered" = "crates/daemon/src/daemon.rs::Daemon::mark_answered"
"daemon.acceptedNativeRef" = "crates/daemon/src/daemon.rs::Daemon::accepted_native_ref"
"daemon.notify" = "crates/daemon/src/daemon.rs::Daemon::notify"
"daemon.setWorkerAgentStatus" = "crates/daemon/src/daemon.rs::Daemon::set_worker_agent_status"
"daemon.typeDraft" = "crates/daemon/src/daemon.rs::Daemon::type_draft"
"daemon.dropDraft" = "crates/daemon/src/daemon.rs::Daemon::drop_draft"
