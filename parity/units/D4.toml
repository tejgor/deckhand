id = "D4"
wave = 2
title = "daemon launch: agent argv/env, worker launch"
crate = "daemon"
ts_sources = ["src/daemon.ts"]
rust_paths = ["crates/daemon/src/launch.rs"]
deps = ["D1"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/daemonFeatures.test.ts", "tests/forks.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"daemon.ts:SETUP_OUTPUT_LIVE_LIMIT" = "deckhand_daemon::launch::SETUP_OUTPUT_LIVE_LIMIT"
"daemon.ts:SETUP_OUTPUT_STORED_LIMIT" = "deckhand_daemon::launch::SETUP_OUTPUT_STORED_LIMIT"
"daemon.ts:programCommandCache" = "deckhand_daemon::launch::LaunchState"
"daemon.ts:WorkerRuntime" = "deckhand_daemon::launch::WorkerRuntime"
"daemon.ts:WorkerEvent" = "deckhand_protocol::worker_ipc::WorkerMessage"
"daemon.ts:resolveProgramCommand" = "deckhand_daemon::daemon::Daemon::resolve_program_command"
"daemon.ts:buildDeckhandAgentName" = "deckhand_daemon::launch::build_deckhand_agent_name"
"daemon.ts:prepareAgentSessionRef" = "deckhand_daemon::launch::prepare_agent_session_ref"
"daemon.ts:resolveShellCommand" = "deckhand_daemon::launch::resolve_shell_command"
"daemon.ts:handoffPrompt" = "deckhand_daemon::launch::handoff_prompt"
"daemon.ts:movedForkPrompt" = "deckhand_daemon::launch::moved_fork_prompt"
"daemon.ts:buildPreviewRecord" = "deckhand_daemon::launch::build_preview_record"
"daemon.ts:isCurrentLaunch" = "deckhand_daemon::daemon::Daemon::is_current_launch"
"daemon.ts:assertCurrentLaunch" = "deckhand_daemon::daemon::Daemon::assert_current_launch"
"daemon.ts:runSetup" = "deckhand_daemon::daemon::Daemon::run_setup"
"daemon.ts:startWorker" = "deckhand_daemon::daemon::Daemon::start_worker"
"daemon.ts:stopWorker" = "deckhand_daemon::daemon::Daemon::stop_worker"
"daemon.ts:sendWorkerRequest" = "deckhand_daemon::daemon::Daemon::send_worker_request"
"daemon.ts:sendWorkerEvent" = "deckhand_daemon::daemon::Daemon::send_worker_event"
"daemon.ts:handleWorkerMessage" = "deckhand_daemon::daemon::Daemon::handle_worker_message"
"daemon.ts:handleWorkerProcessExit" = "deckhand_daemon::daemon::Daemon::handle_worker_process_exit"
"daemon.ts:firstMessageArgs" = "deckhand_daemon::daemon::Daemon::first_message_args"
"daemon.ts:continuedConversation" = "deckhand_daemon::daemon::Daemon::continued_conversation"
"daemon.ts:getPreviewRecord" = "deckhand_daemon::daemon::Daemon::get_preview_record"
"daemon.ts:handleRequest.watch-preview" = "deckhand_daemon::daemon::Daemon::handle_watch_preview"
"daemon.ts:handleRequest.attach" = "deckhand_daemon::daemon::Daemon::handle_attach"
"daemon.ts:handleRequest.input" = "deckhand_daemon::daemon::Daemon::handle_input"
"daemon.ts:handleRequest.resize" = "deckhand_daemon::daemon::Daemon::handle_resize"
