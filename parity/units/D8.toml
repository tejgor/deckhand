id = "D8"
wave = 2
title = "daemon notes + tasks"
crate = "daemon"
ts_sources = ["src/daemon.ts"]
rust_paths = ["crates/daemon/src/notes_tasks.rs"]
deps = ["D1"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/notesDaemon.test.ts", "tests/noteItemsDaemon.test.ts", "tests/tasksDaemon.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"daemon.ts:projectNotes" = "deckhand_daemon::notes_tasks::project_notes"
"daemon.ts:noteOf" = "deckhand_daemon::daemon::Daemon::note_of"
"daemon.ts:mergeWorktreeSessionNotes" = "deckhand_daemon::daemon::Daemon::merge_worktree_session_notes"
"daemon.ts:saveNote" = "deckhand_daemon::daemon::Daemon::save_note"
"daemon.ts:tasksKeyFor" = "deckhand_daemon::daemon::Daemon::tasks_key_for"
"daemon.ts:linkedTasksOf" = "deckhand_daemon::daemon::Daemon::linked_tasks_of"
"daemon.ts:checkTaskLink" = "deckhand_daemon::daemon::Daemon::check_task_link"
"daemon.ts:tasksDoc" = "deckhand_daemon::daemon::Daemon::tasks_doc"
"daemon.ts:broadcastTasks" = "deckhand_daemon::daemon::Daemon::broadcast_tasks"
"daemon.ts:changeTasks" = "deckhand_daemon::daemon::Daemon::change_tasks"
"daemon.ts:changeLinkedTasks" = "deckhand_daemon::daemon::Daemon::change_linked_tasks"
"daemon.ts:syncWorktreeTasks" = "deckhand_daemon::daemon::Daemon::sync_worktree_tasks"
"daemon.ts:syncDoneTasks" = "deckhand_daemon::daemon::Daemon::sync_done_tasks"
"daemon.ts:sendOpenNoteItems" = "deckhand_daemon::daemon::Daemon::send_open_note_items"
"daemon.ts:sendWorktreeItemsToBacklog" = "deckhand_daemon::daemon::Daemon::send_worktree_items_to_backlog"
"daemon.ts:sendNoteItems" = "deckhand_daemon::daemon::Daemon::send_note_items"
"daemon.ts:promoteNoteItem" = "deckhand_daemon::daemon::Daemon::promote_note_item"
"daemon.ts:taskToWorkNote" = "deckhand_daemon::daemon::Daemon::task_to_work_note"
"daemon.ts:migrateFollowUpTasks" = "deckhand_daemon::daemon::Daemon::migrate_follow_up_tasks"
"daemon.ts:returnTaskToNote" = "deckhand_daemon::daemon::Daemon::return_task_to_note"
"daemon.ts:taskOrigin" = "deckhand_daemon::daemon::Daemon::task_origin"
"daemon.ts:moveOpenNoteItems" = "deckhand_daemon::daemon::Daemon::move_open_note_items"
"daemon.ts:notesChanged" = "deckhand_daemon::daemon::Daemon::notes_changed"
"daemon.ts:handleRequest.open-note" = "deckhand_daemon::daemon::Daemon::handle_open_note"
"daemon.ts:handleRequest.watch-tasks" = "deckhand_daemon::daemon::Daemon::handle_watch_tasks"
"daemon.ts:handleRequest.task-op" = "deckhand_daemon::daemon::Daemon::handle_task_op"
"daemon.ts:handleRequest.open-tasks" = "deckhand_daemon::daemon::Daemon::handle_open_tasks"
