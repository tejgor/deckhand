id = "D7"
wave = 2
title = "daemon changes (Git tab)"
crate = "daemon"
ts_sources = ["src/daemon.ts"]
rust_paths = ["crates/daemon/src/changes.rs"]
deps = ["D1"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/daemonFeatures.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"daemon.ts:SUMMARY_TTL_MS" = "deckhand_daemon::changes::SUMMARY_TTL"
"daemon.ts:CHANGES_POLL_MS" = "deckhand_daemon::changes::CHANGES_POLL"
"daemon.ts:CHANGES_FRESH_MS" = "deckhand_daemon::changes::CHANGES_FRESH"
"daemon.ts:ChangesWatch" = "deckhand_daemon::changes::ChangesWatch"
"daemon.ts:changesWatch" = "deckhand_daemon::daemon::Daemon::changes_watch"
"daemon.ts:changesExclusive" = "deckhand_daemon::daemon::Daemon::changes_exclusive"
"daemon.ts:refreshChanges" = "deckhand_daemon::daemon::Daemon::refresh_changes"
"daemon.ts:publishChanges" = "deckhand_daemon::daemon::Daemon::publish_changes"
"daemon.ts:watchChanges" = "deckhand_daemon::daemon::Daemon::watch_changes"
"daemon.ts:syncChangeWatches" = "deckhand_daemon::daemon::Daemon::sync_change_watches"
"daemon.ts:stopChangesWatch" = "deckhand_daemon::daemon::Daemon::stop_changes_watch"
"daemon.ts:handleRequest.watch-changes" = "deckhand_daemon::daemon::Daemon::handle_watch_changes"
"daemon.ts:handleRequest.changes-diff" = "deckhand_daemon::daemon::Daemon::handle_changes_diff"
"daemon.ts:handleRequest.change-stage" = "deckhand_daemon::daemon::Daemon::handle_change_stage"
"daemon.ts:handleRequest.workspace-summary" = "deckhand_daemon::daemon::Daemon::handle_workspace_summary"
"daemon.ts:handleRequest.create-pr" = "deckhand_daemon::daemon::Daemon::handle_create_pr"
