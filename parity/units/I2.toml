id = "I2"
wave = 1
title = "notes store, notes vim script"
crate = "sys"
ts_sources = ["src/notesStore.ts", "src/notesVim.ts"]
rust_paths = ["crates/sys/src/notes_store.rs", "crates/sys/src/notes_vim.rs"]
deps = ["P3"]
ts_tests = ["tests/notesVim.test.ts"]
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = []

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"notesStore.ts:NoteKind" = "deckhand_sys::notes_store::NoteKind"
"notesStore.ts:NoteId" = "deckhand_sys::notes_store::NoteId"
"notesStore.ts:StoredNote" = "deckhand_sys::notes_store::StoredNote"
"notesStore.ts:TRASH_DIRECTORY" = "deckhand_sys::notes_store::TRASH_DIRECTORY"
"notesStore.ts:trashFileName" = "deckhand_sys::notes_store::trash_file_name"
"notesStore.ts:noteFileStem" = "deckhand_sys::notes_store::note_file_stem"
"notesStore.ts:noteFilePath" = "deckhand_sys::notes_store::note_file_path"
"notesStore.ts:NotesStore" = "deckhand_sys::notes_store::NotesStore"
"notesVim.ts:NOTES_VIM_SCRIPT" = "deckhand_sys::notes_vim::NOTES_VIM_SCRIPT"
"notesVim.ts:writeNotesVimScript" = "deckhand_sys::notes_vim::write_notes_vim_script"
