id = "F1"
wave = 3
title = "agents flow"
crate = "ui"
ts_sources = ["src/agentsFlow.tsx"]
rust_paths = ["crates/ui/src/flows/agents.rs"]
deps = []
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = ["tests/agentVersions.test.ts"]

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]
"agentsFlow.tsx:AgentUpdateOutcome" = "deckhand_ui::flows::agents::AgentUpdateOutcome"
"agentsFlow.tsx:AgentsPaneProps" = "deckhand_ui::flows::agents::AgentsPaneProps"
"agentsFlow.tsx:AgentsPane" = "deckhand_ui::flows::agents::render_agents_pane"
"agentsFlow.tsx:AgentsFlow" = "deckhand_ui::flows::agents::AgentsFlow"
"agentsFlow.tsx:useAgentsFlow" = "deckhand_ui::flows::agents::AgentsFlow"
