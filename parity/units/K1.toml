id = "K1"
wave = 1
title = "client: request, ping, spawn daemon, LiveClient"
crate = "client"
ts_sources = ["src/client.ts"]
rust_paths = ["crates/client/src/client.rs", "crates/client/src/live.rs"]
deps = ["P3", "P5"]
ts_tests = []
# TS suites run against target/debug/deckhand (DECKHAND_TEST_BIN); gating only from Wave 4.
ts_suites = []

# Filled by the fixtures stage (parity/gen/<module>.gen.ts).
fixtures = []
# UTF-16 offset fields per fixture, converted on the Rust side.
utf16_fields = {}

# TS test titles covered by another unit or dropped: { title = "...", to = "<unit>|drop", reason = "..." }
deferred_tests = []
# Allowlisted fixture failures (<=2% of cases): { fixture = "...", case = N, reason = "..." }
allowlist = []

# Every TS export: mapped to a Rust path, or dropped with a reason.
[exports]

"client.ts:request" = "deckhand_client::client::request"
"client.ts:ensureDaemonRunning" = "deckhand_client::client::ensure_daemon_running"
"client.ts:openPersistentConnection" = "deckhand_client::client::open_persistent_connection"
"client.ts:LiveClient" = "deckhand_client::live::LiveClient"
"client.ts:createLiveClient" = "deckhand_client::live::create_live_client"
"client.ts:attachJsonParser" = "deckhand_client::client::JsonParser"
"client.ts:writeMessage" = "deckhand_client::client::write_message"
